name: ci

on:
  push:
    branches:
      - main
    paths:
      - "src/**/*.ts"
      - "src/**/*.tsx"
      - "tests/**/*.ts"
      - "tests/**/*.tsx"
      - "scripts/**/*.ts"
      - "plugins/**/*.ts"
      - ".github/actions/**/*.yaml"
      - ".github/workflows/*.yml"
      - "lefthook.yml"
      - "package.json"
      - "aube-lock.yaml"
      - "aube-workspace.yaml"
      - "mise.toml"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - "vitest.app.config.ts"
      - "vitest.oxlint.config.ts"
      - "vite.config.ts"
      - ".oxlintrc.json"
      - "biome.jsonc"
  pull_request:
    paths:
      - "src/**/*.ts"
      - "src/**/*.tsx"
      - "tests/**/*.ts"
      - "tests/**/*.tsx"
      - "scripts/**/*.ts"
      - "plugins/**/*.ts"
      - ".github/actions/**/*.yaml"
      - ".github/workflows/*.yml"
      - "lefthook.yml"
      - "package.json"
      - "aube-lock.yaml"
      - "aube-workspace.yaml"
      - "mise.toml"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - "vitest.app.config.ts"
      - "vitest.oxlint.config.ts"
      - "vite.config.ts"
      - ".oxlintrc.json"
      - "biome.jsonc"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup build environment
        uses: ./.github/actions/setup

      - name: Validate web app
        uses: ./.github/actions/validate-web-app
        with:
          check-biome: "true"
          lint-command: aube run oxc .
          run-tests: "true"
