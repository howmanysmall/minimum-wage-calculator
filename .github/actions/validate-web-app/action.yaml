name: Validate Web App
description: Run lint, tests, build, and dist validation

inputs:
  check-biome:
    description: Run Biome CI
    required: false
    default: "false"
  lint-command:
    description: Lint command to run
    required: false
    default: nr lint
  run-tests:
    description: Run tests
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Biome CI
      if: inputs.check-biome == 'true'
      shell: bash
      run: nr biome ci

    - name: Lint
      shell: bash
      run: ${{ inputs.lint-command }}

    - name: Run tests
      if: inputs.run-tests == 'true'
      shell: bash
      run: nr test

    - name: Build
      shell: bash
      run: nr build

    - name: Assert build artifacts exist
      shell: bash
      run: |
        if [ ! -d dist ]; then
          echo "::error title=Missing output::dist directory not found" >&2
          exit 1
        fi
        if [ ! -f dist/index.html ]; then
          echo "::error title=Missing artifact::dist/index.html not found" >&2
          ls -R dist || true
          exit 1
        fi
        echo "Build artifacts OK"
